# Keeps pinned versions up to date: Dependabot opens a PR with the new version (and
# hashes), so pinning doesn't mean falling behind on fixes.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  # The locks with hashes (requirements.txt, requirements-release.txt,
  # requirements-browser.txt) and the ranges in pyproject.toml.
  - package-ecosystem: pip
    directory: /packaging
    schedule:
      interval: weekly
    ignore:
      # Playwright pins pyee (1.64: <15); it moves together with Playwright.
      - dependency-name: pyee
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
  # The base image of the Dockerfile, pinned by digest.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    ignore:
      # A new Python in the image only after CI tests it (3.11-3.14 now); digest
      # updates of the same version still come.
      - dependency-name: python
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
