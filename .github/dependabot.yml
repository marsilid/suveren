# Keeps pinned versions up to date: Dependabot opens a PR with the new version (and
# hashes), so pinning doesn't mean falling behind on fixes.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  # The locks with hashes (requirements.txt, requirements-release.txt,
  # requirements-browser.txt) and the ranges in pyproject.toml.
  - package-ecosystem: pip
    directory: /packaging
    schedule:
      interval: weekly
    ignore:
      # typer 0.29 pulls in pydantic, which is not in the hashed locks (pip
      # install --require-hashes fails). Moves only together with a deliberate
      # re-lock; updates below 0.29 still come.
      - dependency-name: typer
        versions: [">=0.29"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    ignore:
      # This block also bumps the locks in packaging/, so it needs the same rule as
      # the /packaging block above (a PR from here, #64, failed the docker job).
      - dependency-name: typer
        versions: [">=0.29"]
  # The base image of the Dockerfile, pinned by digest.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    ignore:
      # A new Python in the image only after CI tests it (3.11-3.14 now); digest
      # updates of the same version still come.
      - dependency-name: python
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
