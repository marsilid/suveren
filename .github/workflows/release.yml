name: Release

# Pushing a tag like v1.0.0 builds Suveren.exe on Windows and attaches it to a
# GitHub release, so people without Python can just download and run it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: pip install ".[browser]" pyinstaller
      - name: Build
        run: >-
          pyinstaller --noconfirm --onefile --name Suveren
          --collect-data suveren --collect-submodules dns --collect-all playwright
          packaging/suveren_exe.py
      - name: Smoke test
        run: |
          dist\Suveren.exe --version
          dist\Suveren.exe services
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Suveren-windows
          path: dist/Suveren.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/Suveren.exe
          generate_release_notes: true
