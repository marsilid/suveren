name: Release

# Pushing a tag like v1.0.0 builds Suveren.exe on Windows and attaches it to a
# GitHub release, so people without Python can just download and run it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: pip install ".[browser]" pyinstaller
      - name: Build
        run: >-
          pyinstaller --noconfirm --onefile --name Suveren
          --collect-data suveren --collect-submodules dns --collect-all playwright
          packaging/suveren_exe.py
      - name: Smoke test
        run: |
          dist\Suveren.exe --version
          dist\Suveren.exe services
      - uses: actions/upload-artifact@v4
        with:
          name: Suveren-windows
          path: dist/Suveren.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Suveren.exe
          generate_release_notes: true
