name: Laws

# Weekly: has the text of a law the checks rest on changed (tools/check_laws.py)? A
# failed run (GitHub e-mails the owner) means: reread the provisions, fix the checks,
# record the new fingerprint. Runners are abroad; a law that does not load fails too,
# and says so.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  laws:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: pip install .
      - name: Compare the texts
        run: python tools/check_laws.py
