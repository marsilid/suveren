name: Data sources

# Government sites and public lists change without notice. Probe them every day
# so a breaking change shows up as a failed run (GitHub e-mails the repo owner)
# before users run into it.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: pip install .
      - name: Probe sources
        # Runners are outside Russia, where ЕГРЮЛ and the РКН register often time out.
        run: suveren doctor --abroad
