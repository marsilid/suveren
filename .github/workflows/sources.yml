name: Data sources

# Government sites and public lists change without notice. Probe them every day
# so a breaking change shows up as a failed run (GitHub e-mails the repo owner)
# before users run into it.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: pip install .
      - name: Probe sources
        run: suveren doctor
