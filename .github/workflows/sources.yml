name: Data sources

# Government sites and public lists change without notice. Probe them every day
# so a breaking change shows up as a failed run (GitHub e-mails the repo owner)
# before users run into it.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: pip install .
      - name: Probe sources
        # Runners are outside Russia, where ЕГРЮЛ and the РКН register often time out.
        run: suveren doctor --abroad
