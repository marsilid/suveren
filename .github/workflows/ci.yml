name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Force UTF-8 on Windows runners so Cyrillic CLI output does not crash.
  PYTHONUTF8: "1"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: pip
      - name: Install
        # The runner's own setuptools can be older than its security fixes (pip-audit).
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Types
        run: mypy
      - name: Vulnerable dependencies
        run: pip-audit --skip-editable
      # What Suveren.exe, Docker and Suveren.bat actually install: the locks, not the
      # versions this runner happened to resolve.
      - name: Vulnerable dependencies in the locks
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: |
          pip-audit --disable-pip --require-hashes -r packaging/requirements.txt
          pip-audit --disable-pip --require-hashes -r packaging/requirements-browser.txt
          pip-audit --disable-pip --require-hashes -r packaging/requirements-release.txt
      - name: Test
        run: |
          coverage run -m pytest -q
          coverage report
      - name: CLI smoke test
        run: suveren services

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build -t suveren .
      - name: Smoke test
        run: docker run --rm suveren services
