[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "suveren"
version = "0.1.0"
description = "Проверка зависимости сайта от иностранных сервисов: DNS, почта, хостинг, CDN, скрипты"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["osint", "sanctions", "russia", "import-substitution", "dns", "152-fz", "audit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Natural Language :: Russian",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: Name Service (DNS)",
    "Topic :: Security",
]
dependencies = [
    "httpx>=0.27",
    "dnspython>=2.6",
    "typer>=0.12",
    "rich>=13.7",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/marsilid/suveren"

[project.scripts]
suveren = "suveren.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/suveren"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.format]
# README code samples are aligned by hand.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
